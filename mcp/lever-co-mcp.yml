agent_notes:
  - >-
    Every DELETE tool above is irreversible — Lever documents no restore for
    deleted interviews, panels, notes, files, requisitions or webhooks, and the
    requisition-field docs state outright that data removed by an update "cannot
    be recovered from within Lever or via our API". See the reversibility block
    in conventions/lever-co-conventions.yml before wiring any of them into an
    autonomous loop.
  - >-
    The Data API has NO idempotency key. A retried POST creates a second
    opportunity, note, feedback form or interview.
