source: >-
  SEARCH first: no official Lever MCP server exists. Probed the Lever developer
  surface (https://hire.lever.co/developer, /documentation, /oauth, /partner,
  /usecases, /updates — all HTTP 200 and fetched 2026-08-26) with no mention of
