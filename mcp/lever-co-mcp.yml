description: >-
  Lever does not ship an MCP server, hosted or local. Nothing in the Lever
  developer program addresses agents. The only MCP server that speaks Lever is a
  third-party npm package, mcp-lever, which wraps the PUBLIC job-board endpoints
  only (no API key, no authenticated Data API) and is not affiliated with Lever
  — recorded under third_party below so it is never mistaken for a provider
  surface. The tools[] list is a derived CANDIDATE mapping of what a Lever MCP
  server would expose if one existed, grounded one-to-one in real operationIds.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  checked: '2026-08-26'
  note: >-
    mode is `none` because Lever publishes neither a remote MCP endpoint nor a
    stdio package. No endpoint URL was guessed. An agent that needs Lever today
    must call the REST Data API directly with an OAuth bearer token
    (authentication/lever-co-authentication.yml).
third_party:
  - name: mcp-lever
    registry: npm
    version: 2.0.0
    published: '2026-08-26'
    install: npx -y mcp-lever
    package: https://www.npmjs.com/package/mcp-lever
    source: https://github.com/smeet666/mcp-lever
    author: Damien Bouissou (github.com/smeet666)
    official: false
    mode: local-stdio
    auth: none
    scope: >-
      Public Lever job boards only — resolve a company to its board, search its
      openings, read one posting. Backed by the unauthenticated
      https://api.lever.co/v0/postings/{site} surface. No access to
      opportunities, applications, interviews, feedback or any authenticated
      Data API resource.
    note: Community project. Not endorsed by, affiliated with, or supported by Lever.
