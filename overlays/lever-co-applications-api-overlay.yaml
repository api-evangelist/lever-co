    x-lever-runtime:
      idempotency: none — the Lever Data API accepts no Idempotency-Key. A retried write duplicates.
      pagination: keyset — limit (1-100) plus an opaque offset token; envelope {data, next, hasNext}.
      field_selection: ?include= is SUBTRACTIVE (naming a field suppresses all others); ?expand= inlines id references
        and overrides include.
      error_envelope: '{"code": string, "message": string} as application/json. Not RFC 9457.'
      rate_limit: token bucket per API key — 10 req/s steady, 20 req/s burst, HTTP 429 on exhaustion, no Retry-After
        and no RateLimit-* headers.
      identifiers: bare RFC 4122 UUIDs, no type prefix.
      timestamps: epoch milliseconds (int64), not ISO 8601.
      sandbox: https://api.sandbox.lever.co/v1 — gated behind partner-program approval.
      docs: https://hire.lever.co/developer/documentation
- target: $.paths.*[?(@.operationId)]
  update:
    x-lever-write-safety:
      reversibility: See conventions/lever-co-conventions.yml. Archiving an opportunity is reversible (set the archive
        reason to null); DELETE operations have no documented restore and no grace period.
      retry_hazard: No idempotency key. After a timeout, read back the collection before retrying this write.
