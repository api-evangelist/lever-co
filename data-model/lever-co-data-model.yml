docs: https://hire.lever.co/developer/documentation
notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field
  name; direction is from the entity that holds the reference.
identifiers:
  format: RFC 4122 UUID v4, lowercase, hyphenated (e.g. 250d8f03-738a-4bba-a671-8a3d73477145)
  prefixed: false
  note: >-
    Lever uses NO id prefixes. Every entity's id is a bare UUID, so an id alone
    does not tell an agent what kind of object it points at — unlike prefix
    schemes (Stripe cus_/pi_) an id must always be carried with its type. Ids
    are called "UID" throughout the docs.
timestamps:
  format: integer epoch milliseconds (int64)
  fields: [createdAt, updatedAt, archivedAt, lastInteractionAt, lastAdvancedAt, snoozedUntil, deletedAt, triggeredAt]
core_concept:
  summary: >-
    The central modelling decision, and the one that breaks naive integrations:
    a person and a candidacy are DIFFERENT objects. A Contact is the unique
    human. An Opportunity is one journey of that human through the pipeline for
    one posting. One Contact can own many Opportunities. The legacy Candidate
    resource conflated the two and was deprecated in 2020; the `candidateId`
    field surviving on webhook payloads is the same value as `opportunityId`,
    not a Contact id.
