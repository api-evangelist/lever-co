expandable_references:
  note: >-
    Any id-reference field flagged "Expandable" in the docs can be inlined with
    ?expand=<field> — followers, owner, hiringManager, stage, contact and
    applications are the common ones. Expansion is per-request and takes
    precedence over ?include.
confidentiality:
  applies_to: [Posting, Opportunity, Requisition]
  values: [non-confidential, confidential]
  rule: >-
    An Opportunity can only be confidential if it sits against a confidential
    Posting. Confidential objects are invisible — and return an access error
    rather than an empty result — unless the credential holds the confidential
    grant. Confidential Postings cannot be modified through the API at all.
lifecycle_notes:
  - >-
    An Opportunity exits the pipeline by being ARCHIVED with a reason, not
    deleted. Archiving is reversible (set the reason to null); see the
    reversibility block in conventions/lever-co-conventions.yml.
  - >-
    Opportunities, Postings and Applications that ARE deleted are discoverable
    for reconciliation through the deleted-record endpoints, within a maximum
    30-day query window. That is a visibility window, not a restore window.
