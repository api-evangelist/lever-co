description: >-
  Lever serves no /.well-known/ discovery document on any of its hosts.
  api.lever.co and www.lever.co return a real 404 for every path.
  hire.lever.co is a single-page application whose catch-all route answers
  200 text/html with the Lever Hire shell for ANY /.well-known/* path — that is
  an SPA false positive, not a served document, so it is recorded as a miss and
  nothing was saved. No WellKnown or SecurityTxt pointer is emitted in apis.yml
  because no path returned a real document. Lever's vulnerability-disclosure
  policy is published instead as SECURITY.md in its GitHub repos
  (security/lever-co-vulnerability-disclosure.yml).
