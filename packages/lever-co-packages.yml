implications:
  - >-
    With no first-party SDK, there is no registry release date to read as a
    maintenance signal for the Lever API. The only dated first-party developer
    artifacts are GitHub pushes (postings-api 2026-04-23, integrator-resources
    2025-11-24) and the API changelog at /developer/updates (last entry
    2026-04-30) — all three are current, so the API is actively maintained even
    though the SDK surface is empty.
  - >-
    The official Postman collection is the de-facto client: it is the only
    machine-readable, first-party artifact Lever distributes for the Data API.
