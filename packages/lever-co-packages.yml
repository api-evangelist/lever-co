  at https://hire.lever.co/developer/documentation and /developer/oauth.
description: >-
  FINDING: Lever ships NO first-party SDK in any package registry. There is no
  `lever` package on npm, PyPI, RubyGems, Packagist, crates.io, NuGet, Maven
  Central or pkg.go.dev published by Lever or Employ Inc. What Lever does
  publish is source-only integrator scaffolding on GitHub — an example OAuth app
  and an official Postman collection in lever/integrator-resources, and a Node
  example in lever/postings-api — neither of which is installable from a
  registry and neither of which is versioned or dated as a release. Consumers
  either call the REST API directly or use a third-party wrapper. The
  github.com/lever org's remaining repos are forks of unrelated OSS
  (coffeescript, sharedb, mailparser, quill, derby) and are not Lever API
  clients.
