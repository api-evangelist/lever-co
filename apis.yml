apis:
- aid: lever-co:lever-postings-xml-feed
  name: Lever Postings XML Feed
  tags:
  - Postings
  - Job
  - XML
  - Job Boards
  - Feeds
  tags_raw:
  - Postings
  - Jobs
  - XML
  - Job Boards
  - Feeds
  humanURL: https://hire.lever.co/developer/documentation
  baseURL: https://api.lever.co/v0/postings
  properties:
  - url: https://hire.lever.co/developer/documentation
    type: Documentation
  - url: https://api.lever.co/v0/postings/xmlexample?mode=xml
    type: Sample
  description: >-
    XML feed of all published job postings for a Lever site, designed for distribution to third-party
    job boards. Returned by appending `?mode=xml` to the Postings API list endpoint. Fields include position,
    description, location, and commitment type.
- aid: lever-co:lever-webhooks
  name: Lever Webhooks
  tags:
  - Webhook
  - Event
  - Integration
  tags_raw:
  - Webhooks
  - Events
  - Integrations
  humanURL: https://hire.lever.co/developer/documentation
  properties:
  - url: https://hire.lever.co/developer/documentation
    type: Documentation
  - url: openapi/lever-webhooks-asyncapi.yml
    type: AsyncAPI
  description: >-
    Lever publishes ten webhook events covering the application and candidate lifecycle — applicationCreated,
    candidateHired, candidateStageChange, candidateArchiveChange, candidateDeleted, interviewCreated,
    interviewUpdated, interviewDeleted, contactCreated, contactUpdated. Endpoints must be HTTPS and verify
    the HMAC-SHA256 signature on every delivery.
