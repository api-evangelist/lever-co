name: Lever
description: >-
  Lever is an applicant tracking system (ATS) and candidate relationship management (CRM) platform for
  recruiting teams, now owned by Employ Inc. alongside Jobvite, JazzHR and NXTThing RPO. Lever exposes two
  distinct public surfaces: the authenticated Lever Data API at https://api.lever.co/v1 — a REST API over
  the whole recruiting pipeline (opportunities, contacts, applications, postings, requisitions, interviews,
  panels, feedback, notes, files, offers, users, stages, sources, tags, EEO responses, audit events and
  webhooks) — and an unauthenticated public Postings API at https://api.lever.co/v0/postings used to
  syndicate job listings to careers sites and third-party job boards, including an XML feed mode. Access to
  the Data API is credential-split: Lever customers use HTTP Basic with an API key for their own internal
  workflows, while every third-party product integration must use OAuth 2.0 and be approved through the
  Lever partner program, which also provisions a separate sandbox at https://api.sandbox.lever.co/v1. Lever
  publishes 52 OAuth scopes, ten webhook events with HMAC-SHA256 body signing, a dated API changelog, and a
  deprecation page covering the legacy Candidates surface superseded by Opportunities in 2020. It ships no
  first-party SDK in any package registry and no MCP server.
